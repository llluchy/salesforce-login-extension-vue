<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Salesforce Quick Login - Chrome 扩展</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0a0e14 0%, #131820 100%);
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #1a1f2b;
      border: 1px solid #2a3040;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-family: 'Consolas', monospace;
      font-size: 13px;
      color: #0176D3;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 span { color: #0176D3; }
    .desc {
      color: #8b95a5;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .links a {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .links a.primary {
      background: #0176D3;
      color: #fff;
    }
    .links a.primary:hover {
      background: #0b5cab;
    }
    .links a.secondary {
      background: #222836;
      border: 1px solid #2a3040;
      color: #e8eaf0;
    }
    .links a.secondary:hover {
      background: #2a3040;
      border-color: #0176D3;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #5a6575;
    }

    /* 恢复密钥展示区样式 */
    .warning {
      background: rgba(255, 193, 7, 0.1);
      border: 1px solid rgba(255, 193, 7, 0.4);
      border-radius: 10px;
      padding: 16px 20px;
      margin: 20px 0;
      color: #ffc107;
      font-size: 13px;
      line-height: 1.7;
      text-align: left;
    }
    .warning strong { color: #ffb300; }
    .key-display {
      background: #0d1117;
      border: 1px solid #2a3040;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      word-break: break-all;
    }
    .key-display code {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 16px;
      color: #4fc3f7;
      letter-spacing: 1px;
      user-select: all;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .actions button {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #2a3040;
      border-radius: 8px;
      background: #222836;
      color: #e8eaf0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .actions button:hover {
      background: #2a3040;
      border-color: #0176D3;
    }
    .confirm-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0;
      font-size: 13px;
      color: #8b95a5;
      cursor: pointer;
      justify-content: center;
    }
    .confirm-label input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0176D3;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #0b5cab;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SALESFORCE QUICK LOGIN</div>

    <!-- 恢复密钥展示区（仅 URL 含 rk 参数时显示） -->
    <div id="recoverySection" class="hidden">
      <h1>请保存您的恢复密钥</h1>
      <div class="warning">
        ⚠️ 这是您账号的<strong>恢复密钥</strong>，仅显示一次！<br>
        忘记密码时需要用此密钥找回密码。<br>
        请点击下方按钮下载密钥文件，妥善保存到安全位置。
      </div>
      <div class="actions">
        <button id="downloadBtn" class="btn-primary" style="font-weight:700;font-size:16px;padding:14px 40px;">下载密钥文件</button>
      </div>
      <label class="confirm-label">
        <input type="checkbox" id="confirmCheckbox" />
        我已下载并安全保存了密钥文件
      </label>
      <button id="confirmBtn" class="btn-primary" disabled style="width:100%">确认</button>
    </div>

    <!-- 保存成功提示 -->
    <div id="successSection" class="hidden">
      <div style="font-size:48px;margin-bottom:16px;">✅</div>
      <h1>恢复密钥已确认</h1>
      <p class="desc">您现在可以关闭此页面，回到插件使用新账号登录。</p>
    </div>

    <!-- 原有欢迎页（URL 无 rk 参数时显示） -->
    <div id="welcomeSection">
      <h1>Salesforce <span>Quick Login</span></h1>
      <p class="desc">一键登录所有 Salesforce 环境，支持 Passkey 验证、TOTP 两步验证、端到端加密云同步</p>
      <div class="links">
        <a href="https://49.232.62.216:12116/s/6ae104f5-978a-4214-9c44-0f3843200e7e/doc/5l255so6k05pio-DgX5OhiKa0" class="primary" target="_blank">使用说明文档</a>
        <a href="privacy-policy.html" class="secondary" target="_blank">隐私政策</a>
      </div>
      <div class="footer">
        Chrome Extension · Manifest V3 · Vue 3 + Supabase
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // Supabase 初始化
    const supabaseClient = window.supabase.createClient(
      'https://ulcqqmhykqxdpcoveidf.supabase.co',
      'sb_publishable_b0Xs0scWJ24ZfSye2YV7JA_T-EPwjIF',
      { auth: { autoRefreshToken: false, persistSession: false } }
    )

    // 解析 URL 参数（支持新旧两种格式）
    const params = new URLSearchParams(window.location.search)

    let rkParam = null, saltParam = null, rpParam = null, rpkParam = null

    // 格式 1（v2.3.1+）：单参数 d（base64url 编码的 JSON）
    const dParam = params.get('d')
    if (dParam) {
      try {
        // base64url → base64 → JSON
        let b64 = dParam.replace(/-/g, '+').replace(/_/g, '/')
        while (b64.length % 4) b64 += '='
        const data = JSON.parse(atob(b64))
        rkParam = data.rk || null
        saltParam = data.salt || null
        rpParam = data.rp || null
        rpkParam = data.rpk || null
      } catch (_) { /* 解码失败，回退到旧格式 */ }
    }

    // 格式 2（v2.3.0 旧格式兼容）：多参数 rk / salt / rp / rpk
    if (!rkParam) {
      rkParam = params.get('rk')
      saltParam = params.get('salt')
      rpParam = params.get('rp')
      rpkParam = params.get('rpk')
    }

    if (rkParam) {
      // 解析密钥数据
      let rkD, rkX, rkY
      try {
        const parsed = JSON.parse(rkParam)
        rkD = parsed.d
        rkX = parsed.x || ''
        rkY = parsed.y || ''
      } catch {
        rkD = rkParam
        rkX = ''
        rkY = ''
      }

      let canShow = true

      // 尝试从 URL hash 恢复 session，首次访问时创建 user_secrets
      const hash = window.location.hash.substring(1)
      if (hash && saltParam && rpParam && rpkParam) {
        try {
          const hashParams = new URLSearchParams(hash)
          const accessToken = hashParams.get('access_token')
          const refreshToken = hashParams.get('refresh_token')

          if (accessToken) {
            const { error: sessionErr } = await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken || ''
            })

            if (!sessionErr) {
              const { data: { user } } = await supabaseClient.auth.getUser()

              if (user) {
                // 检查是否已查看过
                const { data: existing } = await supabaseClient
                  .from('user_secrets')
                  .select('recovery_key_shown')
                  .eq('user_id', user.id)
                  .maybeSingle()

                if (existing?.recovery_key_shown) {
                  canShow = false
                } else {
                  // 首次访问：创建 user_secrets 并标记已查看
                  await supabaseClient
                    .from('user_secrets')
                    .upsert({
                      user_id: user.id,
                      salt: saltParam,
                      recovery_password: rpParam,
                      recovery_public_key: rpkParam,
                      recovery_key_shown: true
                    }, { onConflict: 'user_id' })
                }
              }
            }
          }
        } catch (_) { /* 失败不阻塞，仍展示页面 */ }
      } else if (hash && !saltParam) {
        // 旧链接（无 salt/rp/rpk），user_secrets 已在注册时创建，检查 recovery_key_shown
        try {
          const hashParams = new URLSearchParams(hash)
          const accessToken = hashParams.get('access_token')
          if (accessToken) {
            await supabaseClient.auth.setSession({
              access_token: accessToken,
              refresh_token: hashParams.get('refresh_token') || ''
            })
            const { data: { user } } = await supabaseClient.auth.getUser()
            if (user) {
              const { data: existing } = await supabaseClient
                .from('user_secrets')
                .select('recovery_key_shown')
                .eq('user_id', user.id)
                .maybeSingle()

              if (existing?.recovery_key_shown) {
                canShow = false
              } else {
                // 旧格式链接未标记，补标记
                await supabaseClient
                  .from('user_secrets')
                  .update({ recovery_key_shown: true })
                  .eq('user_id', user.id)
              }
            }
          }
        } catch (_) { /* 兼容 */ }
      }

      if (!canShow) {
        // 密钥已被查看过
        document.getElementById('recoverySection').style.display = 'none'
        document.getElementById('welcomeSection').classList.remove('hidden')
        document.getElementById('welcomeSection').innerHTML = `
          <div style="text-align:center;padding:20px 0;">
            <div style="font-size:48px;margin-bottom:16px;opacity:0.6;">🔒</div>
            <h1>链接已失效</h1>
            <p class="desc">此恢复密钥已被查看过，链接仅一次有效。<br>如果您未保存密钥文件，请注册新账号重新设置。</p>
          </div>
        `
      } else {
        // 显示恢复密钥展示区
        document.getElementById('recoverySection').classList.remove('hidden')
        document.getElementById('welcomeSection').classList.add('hidden')

        const confirmCheckbox = document.getElementById('confirmCheckbox')
        const confirmBtn = document.getElementById('confirmBtn')

        confirmCheckbox.addEventListener('change', () => {
          confirmBtn.disabled = !confirmCheckbox.checked
        })

        // 下载按钮
        document.getElementById('downloadBtn').onclick = () => {
          const content = JSON.stringify({
            type: 'salesforce-quick-login-recovery-key',
            version: 2,
            key: rkD,
            x: rkX,
            y: rkY,
            createdAt: new Date().toISOString()
          }, null, 2)
          const blob = new Blob([content], { type: 'application/json' })
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = 'salesforce-recovery-key.json'
          a.click()
          URL.revokeObjectURL(url)
        }

        // 确认按钮
        confirmBtn.onclick = () => {
          if (!confirmCheckbox.checked) {
            alert('请先勾选「我已下载并安全保存了密钥文件」')
            return
          }
          document.getElementById('recoverySection').classList.add('hidden')
          document.getElementById('successSection').classList.remove('hidden')
        }
      }
    }
  </script>
</body>
</html>
