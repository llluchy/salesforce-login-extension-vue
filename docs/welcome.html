<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Salesforce Quick Login - Chrome 扩展</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0a0e14 0%, #131820 100%);
      color: #e8eaf0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #1a1f2b;
      border: 1px solid #2a3040;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .logo {
      font-family: 'Consolas', monospace;
      font-size: 13px;
      color: #0176D3;
      letter-spacing: 1px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 span { color: #0176D3; }
    .desc {
      color: #8b95a5;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .links a {
      display: block;
      padding: 14px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .links a.primary {
      background: #0176D3;
      color: #fff;
    }
    .links a.primary:hover {
      background: #0b5cab;
    }
    .links a.secondary {
      background: #222836;
      border: 1px solid #2a3040;
      color: #e8eaf0;
    }
    .links a.secondary:hover {
      background: #2a3040;
      border-color: #0176D3;
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #5a6575;
    }

    /* 恢复密钥展示区样式 */
    .warning {
      background: rgba(255, 193, 7, 0.1);
      border: 1px solid rgba(255, 193, 7, 0.4);
      border-radius: 10px;
      padding: 16px 20px;
      margin: 20px 0;
      color: #ffc107;
      font-size: 13px;
      line-height: 1.7;
      text-align: left;
    }
    .warning strong { color: #ffb300; }
    .key-display {
      background: #0d1117;
      border: 1px solid #2a3040;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      word-break: break-all;
    }
    .key-display code {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 16px;
      color: #4fc3f7;
      letter-spacing: 1px;
      user-select: all;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .actions button {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #2a3040;
      border-radius: 8px;
      background: #222836;
      color: #e8eaf0;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .actions button:hover {
      background: #2a3040;
      border-color: #0176D3;
    }
    .confirm-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0;
      font-size: 13px;
      color: #8b95a5;
      cursor: pointer;
      justify-content: center;
    }
    .confirm-label input {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0176D3;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #0b5cab;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SALESFORCE QUICK LOGIN</div>

    <!-- 恢复密钥展示区（仅 URL 含 rk 参数时显示） -->
    <div id="recoverySection" class="hidden">
      <h1>请保存您的恢复密钥</h1>
      <div class="warning">
        ⚠️ 这是您账号的<strong>恢复密钥</strong>，仅显示一次！<br>
        忘记密码或账号被盗时，需要用此密钥找回密码。<br>
        请妥善保存（手抄、密码管理器、离线存储）。
      </div>
      <div class="key-display">
        <code id="recoveryKey"></code>
      </div>
      <div class="actions">
        <button id="copyBtn">复制密钥</button>
        <button id="downloadBtn">下载密钥文件</button>
      </div>
      <label class="confirm-label">
        <input type="checkbox" id="confirmCheckbox" />
        我已安全保存了恢复密钥
      </label>
      <button id="confirmBtn" class="btn-primary" disabled>确认</button>
    </div>

    <!-- 保存成功提示 -->
    <div id="successSection" class="hidden">
      <div style="font-size:48px;margin-bottom:16px;">✅</div>
      <h1>恢复密钥已确认</h1>
      <p class="desc">您现在可以关闭此页面，回到插件使用新账号登录。</p>
    </div>

    <!-- 原有欢迎页（URL 无 rk 参数时显示） -->
    <div id="welcomeSection">
      <h1>Salesforce <span>Quick Login</span></h1>
      <p class="desc">一键登录所有 Salesforce 环境，支持 Passkey 验证、TOTP 两步验证、端到端加密云同步</p>
      <div class="links">
        <a href="https://49.232.62.216:12116/s/6ae104f5-978a-4214-9c44-0f3843200e7e/doc/5l255so6k05pio-DgX5OhiKa0" class="primary" target="_blank">使用说明文档</a>
        <a href="privacy-policy.html" class="secondary" target="_blank">隐私政策</a>
      </div>
      <div class="footer">
        Chrome Extension · Manifest V3 · Vue 3 + Supabase
      </div>
    </div>
  </div>

  <script>
    // 解析 URL 参数
    const params = new URLSearchParams(window.location.search)
    const rkParam = params.get('rk')

    if (rkParam) {
      // 解析密钥数据：新格式为 JSON { d, x, y }，旧格式为纯 d 字符串
      let rkD, rkX, rkY
      try {
        const parsed = JSON.parse(rkParam)
        rkD = parsed.d
        rkX = parsed.x || ''
        rkY = parsed.y || ''
      } catch {
        // 旧格式：纯 d 字符串
        rkD = rkParam
        rkX = ''
        rkY = ''
      }

      // 显示恢复密钥展示区，隐藏普通欢迎区
      document.getElementById('recoverySection').classList.remove('hidden')
      document.getElementById('welcomeSection').classList.add('hidden')

      // 显示密钥（只显示 d 部分，保持 43 字符易读）
      document.getElementById('recoveryKey').textContent = rkD

      const confirmCheckbox = document.getElementById('confirmCheckbox')
      const confirmBtn = document.getElementById('confirmBtn')

      // 勾选后启用确认按钮
      confirmCheckbox.addEventListener('change', () => {
        confirmBtn.disabled = !confirmCheckbox.checked
      })

      // 复制按钮（复制 d 值，用户手动输入时只需要 d）
      document.getElementById('copyBtn').onclick = async () => {
        try {
          await navigator.clipboard.writeText(rkD)
          alert('恢复密钥已复制到剪贴板')
        } catch {
          // 降级：选中文本供用户手动复制
          const range = document.createRange()
          range.selectNode(document.getElementById('recoveryKey'))
          window.getSelection().removeAllRanges()
          window.getSelection().addRange(range)
          alert('复制失败，请手动 Ctrl+C 复制选中的密钥')
        }
      }

      // 下载按钮（保存完整密钥数据，含 x,y 确保恢复时正确导入）
      document.getElementById('downloadBtn').onclick = () => {
        const content = JSON.stringify({
          type: 'salesforce-quick-login-recovery-key',
          version: 2,
          key: rkD,
          x: rkX,
          y: rkY,
          createdAt: new Date().toISOString()
        }, null, 2)
        const blob = new Blob([content], { type: 'application/json' })
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = 'salesforce-recovery-key.json'
        a.click()
        URL.revokeObjectURL(url)
      }

      // 确认按钮
      confirmBtn.onclick = () => {
        if (!confirmCheckbox.checked) {
          alert('请先勾选「我已安全保存了恢复密钥」')
          return
        }
        // 清除 URL 中的密钥参数（防止浏览器历史残留）
        history.replaceState(null, '', window.location.pathname)
        // 显示成功提示
        document.getElementById('recoverySection').classList.add('hidden')
        document.getElementById('successSection').classList.remove('hidden')
      }
    }
  </script>
</body>
</html>
