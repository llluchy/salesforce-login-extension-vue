<!DOCTYPE html>
<html lang="zh-CN" data-immersive-translate-page-theme="light"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>重置密码 - Salesforce Quick Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      line-height: 1.6;
      color: #333;
      background: linear-gradient(135deg, #f5f7fa 0%, #e8f0fe 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      max-width: 440px;
      width: 100%;
      padding: 40px 32px;
    }
    .card h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 8px;
      color: #1a1a2e;
    }
    .card .desc {
      text-align: center;
      color: #888;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #00A1E0;
      box-shadow: 0 0 0 3px rgba(0, 161, 224, 0.15);
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #00A1E0;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0088c0;
    }
    .btn-primary:disabled {
      background: #99d6f0;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .message.success {
      display: block;
      background: #e6f7e6;
      color: #2e7d32;
      border: 1px solid #b7e0b7;
    }
    .message.error {
      display: block;
      background: #fde8e8;
      color: #c62828;
      border: 1px solid #f5c6c6;
    }
    .message.info {
      display: block;
      background: #e8f4fc;
      color: #01579b;
      border: 1px solid #b3d9f2;
    }
    .hidden { display: none !important; }
    .password-strength {
      margin-top: 6px;
      height: 4px;
      border-radius: 2px;
      background: #e0e0e0;
      overflow: hidden;
    }
    .password-strength .bar {
      height: 100%;
      width: 0;
      transition: all 0.3s;
    }
    .password-strength .bar.weak { width: 33%; background: #ef5350; }
    .password-strength .bar.medium { width: 66%; background: #ffa726; }
    .password-strength .bar.strong { width: 100%; background: #66bb6a; }
    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
<style data-id="immersive-translate-input-injected-css"></style></head>
<body>
  <div class="card">
    <!-- 默认显示：拦截提示（无 token 时始终可见） -->
    <div id="errorBlock">
      <div style="text-align:center;padding:32px 20px;">
        <div style="font-size:48px;margin-bottom:16px;opacity:0.6;">🔒</div>
        <div style="font-size:17px;font-weight:600;margin-bottom:10px;color:#c62828;">误操作访问</div>
        <div style="font-size:14px;color:#666;line-height:1.8;">
          此页面仅能通过重置密码邮件中的专用链接访问。<br>
          请检查您的邮箱，点击邮件中的「重置密码」按钮进入。<br><br>
          如果您没有收到邮件，请在扩展中重新发送重置密码请求。
        </div>
      </div>
    </div>

    <!-- 重置密码内容区（默认隐藏，有合法 token 后才显示） -->
    <div id="resetContent" class="hidden">
      <h1>重置密码</h1>
      <p class="desc" id="pageDesc">请输入您的新密码</p>

      <!-- 恢复中状态 -->
      <div id="recoveringMessage" class="message info hidden">
        <div class="loading-spinner"></div> 正在验证链接有效性...
      </div>

      <!-- 表单 -->
      <div id="resetForm" class="hidden">
        <div class="form-group">
          <label for="newPassword">新密码</label>
          <input type="password" id="newPassword" placeholder="至少 6 位字符" autocomplete="new-password" minlength="6">
          <div class="password-strength"><div class="bar" id="strengthBar"></div></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">确认新密码</label>
          <input type="password" id="confirmPassword" placeholder="再次输入新密码" autocomplete="new-password">
        </div>
        <button class="btn btn-primary" id="submitBtn" onclick="handleReset()">重置密码</button>
        <div id="formMessage" class="message"></div>
      </div>

      <!-- 成功状态 -->
      <div id="successMessage" class="message success hidden">
        密码重置成功！您现在可以使用新密码登录扩展。
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://ulcqqmhykqxdpcoveidf.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_b0Xs0scWJ24ZfSye2YV7JA_T-EPwjIF'

    let supabaseClient

    function showMessage(el, type, text) {
      el.className = 'message ' + type
      el.textContent = text
    }

    function showInvalidAccess() {
      // 确保重置密码内容区隐藏，错误提示可见
      document.getElementById('resetContent').classList.add('hidden')
      document.getElementById('errorBlock').classList.remove('hidden')
    }

    function getPasswordStrength(password) {
      if (!password) return ''
      if (password.length < 6) return 'weak'
      if (password.length < 10) return 'medium'
      if (/[A-Z]/.test(password) && /[0-9]/.test(password) && /[^A-Za-z0-9]/.test(password)) return 'strong'
      if (password.length >= 12) return 'strong'
      return 'medium'
    }

    document.getElementById('newPassword').addEventListener('input', function() {
      const bar = document.getElementById('strengthBar')
      const strength = getPasswordStrength(this.value)
      bar.className = 'bar' + (strength ? ' ' + strength : '')
    })

    document.getElementById('newPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleReset()
    })
    document.getElementById('confirmPassword').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') handleReset()
    })

    async function init() {
      const recoveringMsg = document.getElementById('recoveringMessage')
      const resetForm = document.getElementById('resetForm')
      const formMessage = document.getElementById('formMessage')
      const errorBlock = document.getElementById('errorBlock')
      const resetContent = document.getElementById('resetContent')

      // 第一步：优先检查 URL hash 中是否携带 token，不依赖任何外部资源
      const hash = window.location.hash.substring(1)
      if (!hash) {
        showInvalidAccess()
        return
      }

      const params = new URLSearchParams(hash)
      const accessToken = params.get('access_token')
      const type = params.get('type')

      if (type !== 'recovery' || !accessToken) {
        showInvalidAccess()
        return
      }

      // hash 校验通过 → 立即隐藏错误提示，显示重置密码区 + 加载中提示
      errorBlock.classList.add('hidden')
      resetContent.classList.remove('hidden')
      recoveringMsg.className = 'message info'
      recoveringMsg.innerHTML = '<div class="loading-spinner"></div> 正在验证链接有效性...'

      // 通过基础检查，尝试初始化 Supabase
      try {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: { autoRefreshToken: false, persistSession: false }
        })

        const refreshToken = params.get('refresh_token')

        // 设置 session（Supabase 的 recovery 流程需要）
        const { error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken || ''
        })

        if (error) {
          console.error('setSession 失败', error)
          recoveringMsg.className = 'message hidden'
          showMessage(formMessage, 'error', '链接已过期或无效。请重新发送重置密码邮件。')
          return
        }

        // 恢复成功，隐藏加载提示，显示重置密码表单
        recoveringMsg.className = 'message hidden'
        resetForm.classList.remove('hidden')

      } catch (e) {
        console.error('初始化失败', e)
        recoveringMsg.className = 'message hidden'
        showMessage(formMessage, 'error', '页面初始化失败：' + e.message)
      }
    }

    async function handleReset() {
      const newPassword = document.getElementById('newPassword').value
      const confirmPassword = document.getElementById('confirmPassword').value
      const submitBtn = document.getElementById('submitBtn')
      const formMessage = document.getElementById('formMessage')
      const successMessage = document.getElementById('successMessage')
      const resetForm = document.getElementById('resetForm')
      const pageDesc = document.getElementById('pageDesc')

      if (!newPassword || newPassword.length < 6) {
        showMessage(formMessage, 'error', '密码至少 6 个字符')
        return
      }
      if (newPassword !== confirmPassword) {
        showMessage(formMessage, 'error', '两次输入的密码不一致')
        return
      }

      submitBtn.disabled = true
      submitBtn.innerHTML = '<span class="loading-spinner"></span> 正在重置...'
      formMessage.className = 'message hidden'

      try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword })

        if (error) {
          console.error('updateUser 失败', error)
          showMessage(formMessage, 'error', '重置密码失败：' + error.message)
          submitBtn.disabled = false
          submitBtn.textContent = '重置密码'
          return
        }

        // 成功
        resetForm.classList.add('hidden')
        pageDesc.textContent = '密码已重置成功'
        successMessage.classList.remove('hidden')
        successMessage.innerHTML = '密码重置成功！您现在可以使用新密码登录扩展。'

      } catch (e) {
        console.error('重置密码异常', e)
        showMessage(formMessage, 'error', '重置密码异常：' + e.message)
        submitBtn.disabled = false
        submitBtn.textContent = '重置密码'
      }
    }

    init()
  </script>

</body></html>
