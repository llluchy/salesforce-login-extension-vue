<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salesforce Quick Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <svg class="header-icon" viewBox="0 0 24 24">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    <span class="header-title">Salesforce Quick Login</span>
  </header>

  <div id="mainView" class="view">
    <div class="list-toolbar">
      <div class="list-title-wrapper">
        <h2 class="list-title">已添加环境</h2>
        <span id="envCount" class="env-count">0 / 50</span>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="syncBtn" class="btn btn-icon" title="同步数据">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button type="button" id="serverConfigBtn" class="btn btn-icon" title="服务器配置">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v2H6v-2zm0 4h8v2H6v-2zm10 0h2v2h-2v-2zm0-4h2v2h-2v-2z"/></svg>
        </button>
        <button type="button" id="addEnvBtn" class="btn btn-icon-primary" title="添加新环境">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>
    </div>
    <div id="envList" class="env-list">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" fill="#ccc"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14z"/></svg>
        <p>暂无已添加环境</p>
        <p class="empty-hint">点击右上角"+"添加</p>
      </div>
    </div>

  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">编辑环境</h3>
        <button type="button" class="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="editAlias">别名</label>
          <input type="text" id="editAlias" placeholder="别名">
        </div>
        <div class="form-group">
          <label for="editUsername">账号</label>
          <input type="text" id="editUsername" placeholder="账号">
        </div>
        <div class="form-group">
          <label for="editPassword">密码</label>
          <input type="password" id="editPassword" placeholder="密码">
        </div>
        <div class="form-group">
          <label for="editEnvironment">环境类型</label>
          <select id="editEnvironment">
            <option value="production">Production</option>
            <option value="sandbox">SandBox</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <div class="form-group" id="editCustomEnvGroup" style="display: none;">
          <label for="editCustomEnv">自定义环境地址</label>
          <input type="text" id="editCustomEnv" placeholder="环境地址">
        </div>
        <div class="form-group mfa-section">
          <label>MFA 认证 <span id="mfaStatus" class="mfa-status">未绑定</span></label>
          <input type="text" id="editTotpSecret" placeholder="手动输入 TOTP Secret（base32）">
          <div class="mfa-actions">
            <button type="button" id="scanQRBtn" class="btn btn-secondary btn-sm">截屏扫描二维码</button>
            <button type="button" id="uploadQRBtn" class="btn btn-secondary btn-sm">上传二维码图片</button>
            <input type="file" id="qrFileInput" accept="image/*" style="display: none;">
          </div>
          <button type="button" id="unbindTotpBtn" class="btn btn-danger btn-sm" style="display: none;">解绑 MFA</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelEditBtn" class="btn btn-secondary">取消</button>
        <button type="button" id="saveEditBtn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>确认删除</h3>
        <button type="button" class="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="delete-warning">
          <svg viewBox="0 0 24 24" fill="#ff4d4f"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
          <p>确定要删除环境 <span id="deleteEnvName"></span> 吗？</p>
          <p class="delete-hint">此操作不可撤销</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelDeleteBtn" class="btn btn-secondary">取消</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger">删除</button>
      </div>
    </div>
  </div>

  <div id="serverConfigModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>服务器配置</h3>
        <button type="button" class="modal-close">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="serverUrl">服务器地址</label>
          <input type="text" id="serverUrl" placeholder="https://your-server.com">
        </div>
        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input type="text" id="apiKey" placeholder="输入API Key">
        </div>
        <div class="sync-actions">
          <button type="button" id="uploadDataBtn" class="btn btn-primary">上传数据</button>
          <button type="button" id="downloadDataBtn" class="btn btn-secondary">下载数据</button>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="cancelServerConfigBtn" class="btn btn-secondary">取消</button>
        <button type="button" id="saveServerConfigBtn" class="btn btn-primary">保存配置</button>
      </div>
    </div>
  </div>

  <script src="lib/jsqr.js"></script>
  <script src="js/totp.js"></script>
  <script src="script.js"></script>
</body>
</html>
